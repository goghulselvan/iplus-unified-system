name: Build & Deploy to FTP

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.vaima.in
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # Known-good path for this FTP user. dangerous-clean-slate wipes it so
          # every deploy is a full, self-consistent set (index.html + assets/
          # always match). The staging->docroot move is still manual in mPanel
          # (MilesWeb won't let us repoint the FTP dir / DocumentRoot yet) — do it
          # as: empty the docroot FIRST, then move, so nothing is left stale.
          server-dir: /cms.iplus.vaima.in/
          dangerous-clean-slate: true
