name: Build & Deploy to FTP

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.vaima.in
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # FTP user is jailed to /cms.iplus.vaima.in/unified_deployment (mPanel
          # won't let us repoint it — MilesWeb ticket open). "/" = that jail root.
          # Use bare "/" not "./" ("./" 550s on the assets/ subdir) and not
          # "/cms.iplus.vaima.in/" (553, nests a folder inside the jail).
          # clean-slate keeps unified_deployment/ a full, self-consistent set.
          # MANUAL STEP in mPanel until the jail is fixed: in the docroot delete
          # everything except unified_deployment/, then move unified_deployment/*
          # (INCLUDING the assets folder) up into the docroot, then flush cache.
          server-dir: /
          dangerous-clean-slate: true
