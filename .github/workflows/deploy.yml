name: Build & Deploy to FTP

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.vaima.in
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # The FTP user is now jailed to the live docroot (/cms.iplus.vaima.in),
          # so "/" IS the docroot — deploy straight there, no staging, no manual
          # move. Use bare "/" not "./": the "./" form hits a SamKirkland bug that
          # 550s on the assets/ subdirectory ("Can't change directory to assets").
          # "/cms.iplus.vaima.in/" would nest a folder inside the jail (553).
          # dangerous-clean-slate wipes the docroot so every deploy is a full,
          # self-consistent upload (index.html + assets/ always match).
          server-dir: /
          dangerous-clean-slate: true
