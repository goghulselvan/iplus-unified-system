name: Build & Deploy to FTP

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.vaima.in
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # "./" = exactly the folder the FTP user lands in (the staging folder
          # you pull files out of in mPanel). Earlier we used
          # "/cms.iplus.vaima.in/", which from inside a jailed FTP account writes
          # to a NESTED cms.iplus.vaima.in/ subfolder your pull never sees.
          # dangerous-clean-slate wipes this folder so every deploy is a full,
          # self-consistent upload — index.html + assets/ always match.
          server-dir: ./
          dangerous-clean-slate: true
